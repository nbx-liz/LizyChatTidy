name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  handoff-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify handoff bundle (pinned manifest, checksums, file set)
        run: bash scripts/verify-handoff.sh docs/handoff
      - name: Verify the checker rejects tampered bundles
        run: bash scripts/test-verify-handoff.sh
